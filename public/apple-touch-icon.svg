<svg width="180" height="180" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Neon glow filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Background gradient -->
    <radialGradient id="bg-gradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0a;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Background rounded rectangle -->
  <rect width="180" height="180" rx="20" ry="20" fill="url(#bg-gradient)" stroke="#333" stroke-width="2"/>
  
  <!-- Left bracket < -->
  <path d="M70 45 L40 75 L40 90 L40 105 L70 135" 
        stroke="#00ff41" 
        stroke-width="8" 
        fill="none" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#neon-glow)"/>
  
  <!-- Forward slash / -->
  <line x1="80" y1="125" x2="100" y2="55" 
        stroke="#00ff41" 
        stroke-width="8" 
        stroke-linecap="round"
        filter="url(#neon-glow)"/>
  
  <!-- Right bracket > -->
  <path d="M110 45 L140 75 L140 90 L140 105 L110 135" 
        stroke="#00ff41" 
        stroke-width="8" 
        fill="none" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#neon-glow)"/>
</svg>